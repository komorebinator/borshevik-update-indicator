description: "GNOME Shell extension entry point. An ES module exporting a default class extending the Shell Extension base class, plus one GObject-registered class for the indicator itself (see update-indicator). On enable() it adds a Quick Settings system indicator holding one hidden icon, and opens a Gio.DBusProxy to rpm-ostree's Sysroot on the system bus; whenever the Deployments property changes it recomputes whether a reboot would apply a new image and shows or hides the icon. The icon has no menu, tooltip or click action of its own — it sits in the Quick Settings indicator strip, so clicking it opens the Quick Settings menu like the icons around it."
extends: @Extension
target: @GnomeShell
platform: GJS (GNOME Shell 50+) — Gio, GObject, Main, QuickSettings
src: borshevik-update-indicator@komorebinator/extension.js
fields:
  - id: BUS_NAME
    type: string
    default: "'org.projectatomic.rpmostree1'"
    description: Well-known name of rpm-ostreed on the system bus. D-Bus activatable, and an unprivileged client may start it, which is what lets the proxy work right after login before anything else has touched rpm-ostree.
  - id: SYSROOT_PATH
    type: string
    default: "'/org/projectatomic/rpmostree1/Sysroot'"
    description: Object path of the Sysroot object.
  - id: SYSROOT_IFACE
    type: string
    default: "'org.projectatomic.rpmostree1.Sysroot'"
    description: Interface carrying the Deployments property (aa{sv}, emits-change). Each deployment dict carries at least the booleans 'booted' and 'staged'; the array is in boot order, so its first entry is what boots next.
  - id: ICON_NAME
    type: string
    default: "'software-update-available-symbolic'"
    description: Symbolic icon shown while a reboot would apply a new image.
  - id: this._indicator
    type: "UpdateIndicator | null"
    default: "null"
    description: The system indicator added to the Quick Settings indicator strip; created in enable(), destroyed in disable().
  - id: this._proxy
    type: "Gio.DBusProxy | null"
    default: "null"
    description: Proxy for SYSROOT_IFACE; set when the async construction started in enable() finishes, nulled in disable().
  - id: this._proxySignalIds
    type: "number[]"
    default: "[]"
    description: Handler ids of the proxy's g-properties-changed and notify::g-name-owner connections, disconnected in disable().
  - id: this._cancellable
    type: "Gio.Cancellable | null"
    default: "null"
    description: Cancels the proxy construction if disable() runs before it finishes, so the callback never touches a torn-down extension.
functions:
  - id: needsReboot
    description: "Module-level pure function. Argument: deployments, the unpacked Deployments array. Returns true when any deployment has staged === true, or when the array is non-empty and its first entry — the one that boots next — does not have booted === true (a pending deployment, e.g. after a non-staged rebase or a rollback). Returns false for an empty or missing array. The same condition as @ImageManagerApp#rpm-ostree#needsReboot (staged || pending)."
  - id: enable
    description: "Creates this._indicator and hands it to Main.panel.statusArea.quickSettings.addExternalIndicator. Creates this._cancellable and starts Gio.DBusProxy.new_for_bus(SYSTEM, flags NONE — so rpm-ostreed is auto-started if it is not running and its properties are loaded, null interface info, BUS_NAME, SYSROOT_PATH, SYSROOT_IFACE, this._cancellable, callback). The callback finishes construction with Gio.DBusProxy.new_for_bus_finish inside try/catch: a cancelled construction returns silently; any other error is logged with console.error and leaves the icon hidden. On success it stores the proxy, connects g-properties-changed and notify::g-name-owner to _sync (ids into this._proxySignalIds), and calls _sync once."
  - id: _sync
    description: "Returns without changing anything when the proxy is null or has no g_name_owner — the daemon has exited while idle and its absence says nothing about the system. Otherwise reads get_cached_property('Deployments'); returns if it is null. Unpacks it with recursiveUnpack() and sets the indicator's icon visible to needsReboot(deployments)."
  - id: disable
    description: "Cancels and nulls this._cancellable; disconnects every id in this._proxySignalIds from the proxy and clears the list; nulls this._proxy. Destroys each of this._indicator.quickSettingsItems (none are added, but it is the documented teardown) and then this._indicator itself, and nulls it."
components:
  - id: update-indicator
    type: @View
    description: "UpdateIndicator — a GObject-registered subclass of QuickSettings.SystemIndicator. Its constructor calls this._addIndicator() once and keeps the returned St.Icon; the indicator strip shows or hides the whole SystemIndicator from its icons' visibility, so hiding the icon is all it takes."
    components:
      - id: update-icon
        type: @Image
        graphic: ICON_NAME
        description: The only icon; its visibility is set by _sync.
        visible: false
        states:
          - id: reboot-pending
            when: needsReboot(Deployments) is true
            property_changes:
              visible: true
        fields:
          - id: this._icon
  - id: metadata
    type: @ConfigFile
    format: JSON
    src: borshevik-update-indicator@komorebinator/metadata.json
    description: "Extension manifest: uuid 'borshevik-update-indicator@komorebinator', name 'Borshevik Update Indicator', a one-sentence description, shell-version ['50'], url pointing at the repository, version 1. No settings-schema — the extension has no preferences."
tests:
  - id: tried-by-the-author
    description: Manual. Whether the icon appears in the right place, looks right and follows the staged state can only be seen in a running shell, against the real rpm-ostreed.
    command: "@BorshevikUpdateIndicatorExtension#recipes#run"
    expect: "the extension is ACTIVE in `gnome-extensions info`; no errors from it in `journalctl --user -b _COMM=gnome-shell`; with no update staged no icon is shown; once an update is staged (by the Image Manager or `rpm-ostree upgrade`) the icon appears among the status icons without a relogin"
recipes:
  - id: run
    description: Runs the extension from the working tree in the current session. On Wayland GNOME Shell cannot be restarted in place and no nested shell is available here (gnome-shell --devkit needs mutter-devkit), so a relogin is part of it.
    instructions:
      - "Link the working-tree extension into the user's extensions directory: `ln -sfn <repository>/borshevik-update-indicator@komorebinator ~/.local/share/gnome-shell/extensions/borshevik-update-indicator@komorebinator`. A per-user extension overrides a system-wide one with the same uuid, so this also works on an image that already ships the extension under /usr/share/gnome-shell/extensions"
      - "Enable it with `gnome-extensions enable borshevik-update-indicator@komorebinator`, then ask the user to log out and back in; a new module is only loaded by a fresh shell"
      - "After the relogin, report `gnome-extensions info borshevik-update-indicator@komorebinator` and any lines mentioning the extension in `journalctl --user -b _COMM=gnome-shell`, then let the user judge the panel"
